[project]
name = "nucleiquant"
version = "0.1.0"
description = "Organoid nuclei segmentation and cell-type quantification pipeline."
readme = "Readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Julien Pigeon" },
]

# IMPORTANT
# The base image (nvcr.io/nvidia/tensorflow:25.02-tf2-py3) already provides
# NVIDIA-patched builds of: tensorflow, keras, numpy, pandas, scipy, numba,
# h5py, tqdm, jupyterlab, ipykernel. DO NOT redeclare these without a pin --
# an unpinned re-install (e.g. stardist pulling in the latest numpy) will
# upgrade numpy out from under TensorFlow and break it. numpy is pinned below
# for exactly this reason.

dependencies = [
    # Match the container's numpy -- do not remove this pin (see note above)
    "numpy==1.26.4",

    # Segmentation model -- versions below are the ones actually tested
    # against the shipped weights (models/stardist_haug2) on this container.
    "stardist==0.9.2",
    "csbdeep==0.8.2",
    "tf_keras==2.17.0",

    # Image I/O
    "tifffile>=2024.1.30",
    "scikit-image>=0.22",
    "imagecodecs>=2024.1.1",

    # Analysis notebooks
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nucleiquant"]
