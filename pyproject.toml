[project]
name = "nucleiquant"
version = "2.0.0"
description = "Count cell types in fluorescence images: StarDist nuclei segmentation, click-to-train random forest classification, Excel counts and statistics."
readme = "Readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Julien Pigeon" },
]

# IMPORTANT
# The base image (nvcr.io/nvidia/tensorflow:25.02-tf2-py3) already provides
# NVIDIA-patched builds of: tensorflow, keras, numpy, pandas, scipy, numba,
# h5py, tqdm, jupyterlab, ipykernel. DO NOT redeclare these without a pin --
# an unpinned re-install (e.g. stardist pulling in the latest numpy) will
# upgrade numpy out from under TensorFlow and break it. numpy is pinned below
# for exactly this reason.

dependencies = [
    # Match the container's numpy -- do not remove this pin (see note above)
    "numpy==1.26.4",

    # Segmentation model -- versions below are the ones actually tested
    # against the shipped weights (models/stardist_haug2) on this container.
    "stardist==0.9.2",
    "csbdeep==0.8.2",
    "tf_keras==2.17.0",

    # Image I/O
    "tifffile>=2024.1.30",
    "scikit-image>=0.22",
    "imagecodecs>=2024.1.1",

    # Analysis notebooks
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",

    # V2 app: features, classifier, ROIs, web interface.
    # scikit-learn and numba are the container's own versions (pinned so a
    # saved classifier and the numba kernels behave the same everywhere).
    "scikit-learn==1.5.2",
    "numba==0.59.1",
    "roifile==2026.2.10",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
nucleiquant = "nucleiquant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nucleiquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
